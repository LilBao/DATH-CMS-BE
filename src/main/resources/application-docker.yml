spring:
  datasource:
    url: jdbc:mysql://mysql:3306/cgv?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${MYSQL_USER:cgv_user}
    password: ${MYSQL_PASSWORD:cgv_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

server:
  port: 8080
